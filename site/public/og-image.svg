<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b97500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#121416"/>

  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- Headline -->
  <text x="600" y="230" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#e2e2e5" text-anchor="middle">
    <tspan x="600" dy="0">Cleveland police helicopters</tspan>
    <tspan x="600" dy="72">fly over your neighborhood</tspan>
    <tspan x="600" dy="72">almost every night.</tspan>
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#1a1c1e"/>
  <text x="600" y="608" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f59e0b" text-anchor="middle">Cleveland Helicopter Watch</text>
</svg>
